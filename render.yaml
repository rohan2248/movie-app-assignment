services:
  - type: web
    name: movie-app-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./data/movies.db
      - key: CORS_ORIGINS
        value: http://localhost:8081,http://localhost:19006
      - key: ENABLE_FAULT_INJECTION
        value: '1'
      - key: LOG_LEVEL
        value: info
      - key: TMDB_ACCESS_TOKEN
        sync: false
      - key: TMDB_API_KEY
        sync: false
